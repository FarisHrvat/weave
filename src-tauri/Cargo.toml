[package]
name = "weave"
version = "0.1.0"
description = "Git, files, and terminals in one workspace"
authors = ["Faris Hrvat <AssayPlot@pm.me>"]
license = "MIT"
repository = "https://github.com/FarisHrvat/weave"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v4"] }
dirs = "6"
portable-pty = "0.9"
sha2 = "0.10"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
md-5 = "0.10"
hmac = "0.12"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2.3"
keyring = "4.2.0"
libc = "0.2"
suppaftp = { version = "12.1.1", features = ["native-tls", "deprecated"] }
zeroize = { version = "1.9", features = ["serde"] }
percent-encoding = "2"
url = "2"
reqwest = { version = "=0.13.3", features = ["blocking", "json", "query", "form"] }
rustls = "0.23.45"
rustls-platform-verifier = "0.7.0"
quick-xml = "=0.41.0"
tempfile = "3"
httpdate = "1"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
argon2 = "0.5.3"
aes = "0.8.4"
aes-gcm = "0.10.3"
ctr = "0.9.2"
aes-siv = "0.7.0"
aes-kw = { version = "0.2.1", features = ["alloc"] }
scrypt = { version = "0.11.0", default-features = false }
sha1 = "0.10.6"
unicode-normalization = "0.1.24"
dunce = "1.0.5"
serialport = { version = "4.10.1", default-features = false }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "=0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
block2 = "=0.6.2"

[target.'cfg(windows)'.dependencies]
p12-keystore = "0.4.1"

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
